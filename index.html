<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школьный Планер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f9);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222);
      --hint-color: var(--tg-theme-hint-color, #888);
      --button-color: var(--tg-theme-button-color, #3390ec);
      --button-text: var(--tg-theme-button-text-color, #fff);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .reset-settings {
      font-size: 12px;
      color: var(--hint-color);
    }

    .reset-settings input {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .day-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .day-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .day-date {
      font-size: 11px;
      color: var(--hint-color);
      margin-bottom: 8px;
    }

    .lesson-item {
      display: flex;
      align-items: center;
      font-size: 13px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .lesson-item input {
      margin-right: 6px;
      cursor: pointer;
    }

    .completed {
      text-decoration: line-through;
      color: var(--hint-color);
    }

    /* Модальное окно редактирования */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      padding: 20px;
      box-sizing: border-box;
      z-index: 10;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      max-width: 500px;
      margin: 20px auto;
    }

    textarea {
      width: 100%;
      height: 150px;
      box-sizing: border-box;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      padding: 8px;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3 style="margin:0;">📅 Расписание</h3>
    <div class="header-actions">
      <div class="reset-settings">
        Сброс: <input type="time" id="resetTime" value="08:30" onchange="updateResetTime()">
      </div>
      <button class="btn" onclick="toggleEditModal()">✏️ Изменить</button>
    </div>
  </div>

  <div class="grid" id="scheduleGrid"></div>

  <!-- Модальное окно редактирования -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h4 style="margin-top:0;">Редактирование расписания</h4>
      <div style="font-size:12px; color: var(--hint-color);">
        Формат: День: Предмет1, Предмет2
      </div>
      <textarea id="scheduleInput"></textarea>
      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <button class="btn" style="background:#888;" onclick="toggleEditModal()">Отмена</button>
        <button class="btn" onclick="saveScheduleFromApp()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const userId = tg.initDataUnsafe?.user?.id || 12345;
  const daysOrder = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];


  const API_URL = "https://my-school-schedule.onrender.com/api";

  let userSchedule = null;
  let taskStates = {};

  const defaultSchedule = {
    "Пн": ["Математика", "Физика", "Русский язык"],
    "Вт": ["Обществознание", "История", "Английский"],
    "Ср": ["Алгебра", "Геометрия", "Химия"],
    "Чт": ["Информатика", "Физика", "Биология"],
    "Пт": ["Литература", "Русский язык", "Физкультура"],
    "Сб": ["География", "Английский"]
  };

  async function loadData() {
    try {
      const res = await fetch(`${API_URL}/get_data?user_id=${userId}`);
      const data = await res.json();
      
      userSchedule = data.schedule || defaultSchedule;
      taskStates = data.tasks || {};
      
      if (data.reset_time) {
        document.getElementById("resetTime").value = data.reset_time;
      }
      
      renderGrid();
    } catch (e) {
      console.error("Ошибка загрузки данных", e);
      renderGrid();
    }
  }

  function getTargetDate(dayIndex, resetTimeStr) {
    const now = new Date();
    const currentDay = now.getDay();
    let targetDayNum = dayIndex + 1; 
    let diff = targetDayNum - (currentDay === 0 ? 7 : currentDay);

    const [rHours, rMinutes] = resetTimeStr.split(":").map(Number);
    const resetTimeToday = new Date(now);
    resetTimeToday.setHours(rHours, rMinutes, 0, 0);

    if (diff === 0 && now >= resetTimeToday) {
      diff += 7;
    } else if (diff < 0) {
      diff += 7;
    }

    const targetDate = new Date(now);
    targetDate.setDate(now.getDate() + diff);
    return targetDate;
  }

  function renderGrid() {
    const resetTime = document.getElementById("resetTime").value;
    const schedule = userSchedule || defaultSchedule;
    const grid = document.getElementById("scheduleGrid");
    grid.innerHTML = "";

    daysOrder.forEach((day, index) => {
      const dateObj = getTargetDate(index, resetTime);
      const dateStr = dateObj.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
      const dateKey = dateObj.toISOString().split('T')[0];

      const card = document.createElement("div");
      card.className = "day-card";

      let lessonsHtml = "";
      (schedule[day] || []).forEach((lesson, lIdx) => {
        const storageKey = `${userId}_${dateKey}_${day}_${lIdx}`;
        const isChecked = taskStates[storageKey] === true;

        lessonsHtml += `
          <label class="lesson-item ${isChecked ? 'completed' : ''}">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleLesson('${storageKey}', this)">
            ${lesson}
          </label>
        `;
      });

        card.innerHTML = `
          <div class="day-title">${day}</div>
          <div class="day-date">${dateStr}</div>
          ${lessonsHtml || '<div style="font-size:12px; color:#888;">Нет уроков</div>'}
        `;
      grid.appendChild(card);
    });
  }

  async function toggleLesson(key, checkbox) {
    checkbox.parentElement.classList.toggle("completed", checkbox.checked);
    taskStates[key] = checkbox.checked;

    await fetch(`${API_URL}/toggle_task`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key, checked: checkbox.checked })
    });
  }

  async function updateResetTime() {
    const timeVal = document.getElementById("resetTime").value;
    renderGrid();

    await fetch(`${API_URL}/save_reset_time`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, reset_time: timeVal })
    });
  }

  function toggleEditModal() {
    const modal = document.getElementById("editModal");
    const isHidden = modal.style.display === "none" || !modal.style.display;
    modal.style.display = isHidden ? "block" : "none";

    if (isHidden) {
      const schedule = userSchedule || defaultSchedule;
      let text = "";
      daysOrder.forEach(day => {
        text += `${day}: ${(schedule[day] || []).join(", ")}\n`;
      });
      document.getElementById("scheduleInput").value = text.trim();
    }
  }

  async function saveScheduleFromApp() {
    const text = document.getElementById("scheduleInput").value;
    const lines = text.split("\n");
    const newSched = {};

    lines.forEach(line => {
      if (line.includes(":")) {
        const [day, lessonsStr] = line.split(":");
        const dayTrim = day.trim();
        if (daysOrder.includes(dayTrim)) {
          newSched[dayTrim] = lessonsStr.split(",").map(l => l.trim()).filter(Boolean);
        }
      }
    });

    userSchedule = newSched;
    toggleEditModal();
    renderGrid();

    await fetch(`${API_URL}/save_schedule`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, schedule: newSched })
    });
  }

  loadData();
</script>
</body>
</html>
